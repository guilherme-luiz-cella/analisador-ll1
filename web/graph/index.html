<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grafo · Analisador LL(1)</title>
  <meta name="description" content="Mapa interativo do Analisador Sintático LL(1): notas sobre cada tipo e o grafo do código em Go.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="graph.css">
</head>
<body>
  <header class="top">
    <div class="top-title">
      <h1>Grafo do projeto</h1>
      <p>Analisador Sintático LL(1) · Compiladores · URI Erechim</p>
    </div>
    <nav class="top-links">
      <a href="/">← Voltar ao analisador</a>
      <a id="repo-link" href="https://github.com/guilherme-luiz-cella/analisador-ll1" target="_blank" rel="noopener">Código no GitHub</a>
    </nav>
  </header>

  <section class="toolbar" aria-label="Busca e filtros">
    <div class="mode" role="group" aria-label="Tipo de grafo">
      <button id="mode-notes" class="mode-btn" type="button" aria-pressed="true">Notas</button>
      <button id="mode-code" class="mode-btn" type="button" aria-pressed="false">Código</button>
    </div>
    <div class="search">
      <label for="search">Buscar</label>
      <input id="search" type="search" placeholder="Nota, função, tipo ou arquivo (ex.: Parser)" autocomplete="off" spellcheck="false">
      <span id="search-count" class="search-count" aria-live="polite"></span>
    </div>
    <details id="filters-box" class="filters-box" open>
      <summary>Filtros</summary>
      <div class="filters-body">
        <fieldset class="filters">
          <legend>Mostrar nós</legend>
          <div id="node-filters" class="chips"></div>
        </fieldset>
        <fieldset id="edge-fieldset" class="filters">
          <legend>Mostrar ligações</legend>
          <div id="edge-filters" class="chips"></div>
        </fieldset>
      </div>
    </details>
    <button id="fit" class="btn" type="button">Ajustar à tela</button>
  </section>

  <main class="layout">
    <section class="stage" aria-label="Grafo">
      <div id="graph" class="graph" role="img" aria-label="Grafo interativo do projeto"></div>
      <p id="status" class="status">Montando o grafo…</p>
    </section>
    <aside id="panel" class="panel" aria-live="polite" aria-label="Detalhes do nó"></aside>
  </main>

  <script src="vendor/vis-network.min.js"></script>
  <script src="markdown.js"></script>
  <script src="graph.js"></script>
</body>
</html>
